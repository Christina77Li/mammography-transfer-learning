experiment_name: exp2b_full_data_transfer
output_dir: outputs/exp2b_full_data_transfer
seed: 42
deterministic: false
device: cuda

model:
  name: resnet101
  architecture: resnet101
  num_classes: 1
  imagenet_weights: true
  init_checkpoint: outputs/exp2a_balanced_warmup/checkpoints/selected_transition_checkpoint.pth

data:
  image_dir: input/images_as_pngs_512/train_images_processed_512
  label_csv_path: input/train.csv
  image_size: 256
  batch_size: 64
  num_workers: 4
  val_pct: 0.2
  use_weighted_sampler: false
  split_path: input/rsna_split_seed42.json

training:
  min_epochs: 5
  max_epochs: 25
  epochs: 25
  batch_size: 64

phases:
  - name: full_data_transfer
    loader: train
    epochs: 25
    freeze_backbone: false
    gradual_unfreeze: false
    source_checkpoint_type: selected
    source_epoch: 4
    source_val_loss: 0.264389
    source_val_auc: 0.643595
    checkpoint_selection:
      enabled: true
      selection: best_auc_with_loss_tolerance
      monitor_auc: val_auc
      monitor_loss: val_loss
      loss_tolerance_from_best_loss: 0.03

loss:
  type: bce_pos
  sqrt_pos_weight: true

optimizer:
  type: adamw
  lr: 0.00001
  weight_decay: 0.0001

scheduler:
  type: reduce_on_plateau
  monitor: val_loss
  mode: min
  factor: 0.5
  patience: 3
  threshold: 0.001
  cooldown: 1
  min_lr: 0.0000005

early_stopping:
  monitor: val_auc
  mode: max
  patience: 7
  min_delta: 0.002
  start_epoch: 8

logging:
  use_wandb: false
  project: breast-cancer-detection
