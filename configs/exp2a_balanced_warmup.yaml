experiment_name: exp2a_balanced_warmup
output_dir: outputs/exp2a_balanced_warmup
seed: 42
deterministic: false
device: cuda

model:
  name: resnet101
  architecture: resnet101
  num_classes: 1
  imagenet_weights: true
  init_checkpoint: null

data:
  image_dir: input/images_as_pngs_512/train_images_processed_512
  label_csv_path: input/train.csv
  image_size: 256
  batch_size: 64
  num_workers: 4
  val_pct: 0.2
  use_weighted_sampler: false
  split_path: input/rsna_split_seed42.json
  small_subset:
    enabled: true
    pos_neg_ratio: 3.0
    pos_fraction: 1.0
    split_path: input/rsna_small_subset_exp2a_seed42.json

training:
  min_epochs: 8
  max_epochs: 18
  epochs: 18
  batch_size: 64

phases:
  - name: balanced_warmup
    loader: small
    epochs: 18
    freeze_backbone: false
    gradual_unfreeze: false
    checkpoint_selection:
      enabled: true
      selection: best_auc_with_loss_tolerance
      monitor_auc: val_auc
      monitor_loss: val_loss
      loss_tolerance_from_best_loss: 0.05
      max_allowed_val_loss: 0.30

loss:
  type: bce

optimizer:
  type: adamw
  lr: 0.00003
  weight_decay: 0.0001

scheduler:
  type: reduce_on_plateau
  monitor: val_auc
  mode: max
  factor: 0.5
  patience: 3
  threshold: 0.002
  cooldown: 1
  min_lr: 0.000001

early_stopping:
  monitor: val_loss
  mode: min
  patience: 4
  min_delta: 0.001
  start_epoch: 8

save:
  save_best_val_loss: true
  save_best_val_auc: true
  save_selected_transition: true
  save_final: true
  save_history_csv: true

logging:
  use_wandb: false
  project: breast-cancer-detection
