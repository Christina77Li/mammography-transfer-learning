experiment_name: exp1_baseline
output_dir: outputs/exp1_baseline
seed: 42
deterministic: false
data:
  image_dir: input/images_as_pngs_512/train_images_processed_512
  label_csv_path: input/train.csv
  split_path: input/rsna_split_seed42.json
  val_pct: 0.2
  image_size: 256
  num_workers: 4
  use_weighted_sampler: false
  small_subset:
    enabled: false
    pos_neg_ratio: 1.0
model:
  name: resnet101
  imagenet_weights: true
training:
  epochs: 100
  batch_size: 128
phases:
- name: full_baseline
  loader: train
  epochs: 100
  freeze_backbone: false
  gradual_unfreeze: false
optimizer:
  type: adamw
  lr: 0.001
  weight_decay: 0.0005
loss:
  type: bce_pos
  sqrt_pos_weight: true
scheduler:
  type: reduce_on_plateau
  monitor: val_loss
  mode: min
  factor: 0.5
  patience: 3
  min_lr: 1.0e-08
early_stopping:
  monitor: val_loss
  mode: min
  patience: 10
  min_delta: 0.001
  start_epoch: 10
logging:
  use_wandb: false
  project: breast-cancer-detection
